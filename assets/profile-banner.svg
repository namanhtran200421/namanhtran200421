<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Nam Anh Tran — Software Engineering and Applied AI</title>
  <desc id="desc">A navy and mint portfolio masthead with a geometric illustration connecting interfaces, systems and evidence.</desc>
  <defs>
